# bedrock-values.yaml
# Corrected to match actual Helm chart value structure

# Catalog service → MySQL RDS
catalog:
  app:
    persistence:
      provider: mysql
      endpoint: bedrock-mysql.cedysk464ef6.us-east-1.rds.amazonaws.com:3306
      database: catalog
      secret:
        create: true
        name: catalog-db
        username: dbadmin
        password: SecureBedrockPass2026!
  mysql:
    create: false

# Orders service → PostgreSQL RDS
orders:
  app:
    persistence:
      provider: postgresql
      endpoint: bedrock-postgres.cedysk464ef6.us-east-1.rds.amazonaws.com:5432
      database: orders
      secret:
        create: true
        name: orders-db
        username: dbadmin
        password: SecureBedrockPass2026!
    messaging:
      provider: in-memory
  postgresql:
    create: false

# Carts service → DynamoDB
carts:
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: items
        createTable: false
  dynamodb:
    create: false
