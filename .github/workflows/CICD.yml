name: 'Terraform CI/CD'

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manually triggering the pipeline from GitHub's UI

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform Engine'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1 # Crucial: S3 backend initializers specifically look for this variable

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Setup Terraform Engine
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false # Crucial: Prevents text corruption when exporting json data

# Diagnostic Step: This will safely verify if GitHub is actually passing your secrets
    - name: Validate AWS Secret Ingestion
      run: |
        if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "❌ CRITICAL ERROR: GitHub Secrets are resolving to EMPTY strings."
          echo "secrets must be named EXACTLY 'AWS_ACCESS_KEY_ID' and 'AWS_SECRET_ACCESS_KEY' under Repository Secrets."
          exit 1
        else
          echo "✅ GitHub Secrets successfully ingested into the runner environment."
        fi

    - name: Terraform Init
      run: terraform -chdir=terraform init

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: terraform -chdir=terraform plan -no-color

    - name: Terraform Apply & Artifact Export
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        terraform -chdir=terraform apply -auto-approve
        terraform -chdir=terraform output -json > grading.json

    - name: Archive Submission Artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: capstone-grading-deliverable
        path: grading.json
