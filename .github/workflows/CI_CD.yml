name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-plan:
    name: 'Terraform Plan (PR Review)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Validate AWS Secret Ingestion
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ CRITICAL ERROR: GitHub Secrets are resolving to EMPTY strings."
            echo "Ensure repository secrets are named EXACTLY:"
            echo "  AWS_ACCESS_KEY_ID"
            echo "  AWS_SECRET_ACCESS_KEY"
            exit 1
          else
            echo "✅ GitHub Secrets successfully ingested."
          fi

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=terraform plan -no-color 2>&1 | tee /tmp/plan_output.txt
          echo "PLAN_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = planOutput.length > maxLength
              ? planOutput.substring(0, maxLength) + '\n\n... [output truncated]'
              : planOutput;

            const comment = `## 🔍 Terraform Plan Output

            <details>
            <summary>Click to expand full plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            > Plan generated from commit \`${{ github.sha }}\`
            > Review carefully before merging to main.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if Plan Failed
        if: env.PLAN_EXIT_CODE != '0'
        run: exit 1

  terraform-apply:
    name: 'Terraform Apply (Main Deploy)'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate AWS Secret Ingestion
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ CRITICAL ERROR: GitHub Secrets are resolving to EMPTY strings."
            exit 1
          else
            echo "✅ GitHub Secrets successfully ingested."
          fi

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name project-bedrock-cluster \
            --region us-east-1

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve

      - name: Generate grading.json (secrets redacted)
        run: |
          terraform -chdir=terraform output -json | \
            jq '.developer_secret_access_key.value = "REDACTED-SEE-GOOGLE-DOC"' \
            > grading.json
          echo "✅ grading.json generated with secret redacted"
          cat grading.json

      - name: Commit grading.json back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add grading.json
          git diff --staged --quiet || git commit -m "ci: update grading.json from terraform output [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Grading Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capstone-grading-deliverable
          path: grading.json
